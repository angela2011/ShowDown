worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

        error_log /dev/stderr warn;

    # Azure's ingress sits in front of this container, so $remote_addr is the
    # ingress, not the visitor. The right-most X-Forwarded-For entry is the
    # visitor address as the ingress saw it (the left side can be spoofed).
    map $http_x_forwarded_for $client_key {
        default                  $binary_remote_addr;
        "~(?<last>[^,\s]+)\s*$"  $last;
    }

    log_format gateway '$remote_addr xff="$http_x_forwarded_for" key=$client_key "$request" $status';
    access_log /dev/stdout gateway;

    limit_req_zone $client_key zone=api_limit:10m rate=30r/m;
    
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream api_backend {
        server ${API_HOST}:${API_PORT};
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        location = /api {
            return 308 /api/;
        }

        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            # Strip /api/ before forwarding to FastAPI.
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;

            # Azure ingress routes using the backend app's hostname.
            proxy_set_header Host ${API_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Missing assets should return 404, not the React HTML.
        location /assets/ {
            try_files $uri =404;
        }

        # Revalidate the entry page after deployments.
        location = /index.html {
            expires -1;
        }

        # React handles client-side routes such as /login.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}